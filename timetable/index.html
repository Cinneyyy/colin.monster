<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="dark">
        <title>Timetable</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="style.css">
        <script src="/script/themeSelector.js" defer></script>
        <script src="load.js" defer></script>
    </head>
    <body>
        <div id="timetable-content">
            <div id="weekdays">
                <div id="day-0">
                    <h2>mon 01</h2>
                    <div class="event-container"></div>
                </div>
                <div id="day-1">
                    <h2>tue 02</h2>
                    <div class="event-container"></div>
                </div>
                <div id="day-2">
                    <h2>wed 03</h2>
                    <div class="event-container"></div>
                </div>
                <div id="day-3">
                    <h2>thu 04</h2>
                    <div class="event-container"></div>
                </div>
                <div id="day-4">
                    <h2>fri 05</h2>
                    <div class="event-container"></div>
                </div>
                <div id="day-5" hidden>
                    <h2>sat 06</h2>
                    <div class="event-container"></div>
                </div>
                <div id="day-6" hidden>
                    <h2>sun 07</h2>
                    <div class="event-container"></div>
                </div>
            </div>
        </div>
        <div id="controls">
            <button id="prev" onclick="prevWeek();">&lt; Prev</button>
            <h3 id="date-display">01 jan 1970</h3>
            <input id="cal-id-input" onchange="reload();">
            <button id="next" onclick="nextWeek();">Next &gt;</button>
        </div>
    </body>
</html>
